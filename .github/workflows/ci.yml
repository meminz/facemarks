name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Import smoke test
        shell: python
        run: |
          import facemarks
          from importlib import import_module

          for name in ("predict", "import_mesh_and_setup", "save_facemarks_json", "render_result"):
              attr = getattr(facemarks, name)
              assert callable(attr), f"{name} is not callable: {attr!r}"

          module = import_module("facemarks.predict")
          assert callable(module.predict)

          from facemarks._projection import NUM_FACEMARKS

          print("smoke test passed")
